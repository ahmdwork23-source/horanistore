<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>بضاعة أحذية الحوراني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with three tabs (overview / shop pallets / partnership); each section = summary strip, then filterable product grid with photos */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e9ebe7; --line:#d9ddd6;
  --fg:#1d2420; --muted:#5f6a63;
  --p1:#1f6f68; --p1-soft:#dcefec;      /* مشطاح 1 */
  --p2:#b4621b; --p2-soft:#f6e6d6;      /* مشطاح 2 */
  --pt:#6a3d8f; --pt-soft:#ece2f4;      /* الشراكة */
  --warn:#a8321f; --warn-soft:#f8e1dc;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1b201d; --sunk:#232925; --line:#313833;
  --fg:#e7ebe8; --muted:#9aa59e;
  --p1:#5cc2b8; --p1-soft:#173532; --p2:#e7a061; --p2-soft:#3a2816;
  --pt:#bb93df; --pt-soft:#2e2338; --warn:#f08a74; --warn-soft:#3b1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b201d; --sunk:#232925; --line:#313833;
  --fg:#e7ebe8; --muted:#9aa59e;
  --p1:#5cc2b8; --p1-soft:#173532; --p2:#e7a061; --p2-soft:#3a2816;
  --pt:#bb93df; --pt-soft:#2e2338; --warn:#f08a74; --warn-soft:#3b1d17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.head-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
nav.tabs button{font:600 .95rem var(--display);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
main{padding-block:20px 60px}
section.view{display:grid;gap:22px}
h2{font-family:var(--display);font-size:1.15rem;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{font-family:var(--display);font-size:1rem;margin:0}
.tag{font:600 .75rem var(--display);padding:3px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.t-p1{background:var(--p1-soft);color:var(--p1)} .t-p2{background:var(--p2-soft);color:var(--p2)} .t-pt{background:var(--pt-soft);color:var(--pt)} .t-w{background:var(--warn-soft);color:var(--warn)}

/* overview blocks */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;border-top:5px solid var(--c)}
.block .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{color:var(--muted);font-size:.8rem}
.kv b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.kv b small{font-size:.75rem;font-weight:400;color:var(--muted)}
.block button.go{justify-self:start;font:600 .85rem var(--display);background:none;border:0;color:var(--c);cursor:pointer;padding:0}
.mix{display:grid;gap:8px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-inline-end:5px;vertical-align:-1px}
.panel>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
#invPanel .costs .row.big b{color:var(--p1)}
.cat-table{width:100%;border-collapse:collapse;font-size:.9rem}
.cat-table th,.cat-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.cat-table th{font:600 .78rem var(--display);color:var(--muted)}
.cat-table td.n{font-variant-numeric:tabular-nums;font-family:var(--display)}
.scroll{overflow-x:auto}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:600 .85rem var(--display);border:0;background:none;color:var(--fg);padding:7px 14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c,var(--fg));color:var(--surface)}
.search{flex:1 1 200px;min-width:0;font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 .8rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--sunk)}
.result-line{font-size:.85rem;color:var(--muted)}
.result-line b{color:var(--fg);font-family:var(--display);font-variant-numeric:tabular-nums}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.card .ph{position:relative;aspect-ratio:1/1;background:var(--sunk);cursor:zoom-in;border:0;padding:0;width:100%;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.card .ph .tag{position:absolute;top:8px;right:8px;box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.card .ph .cnt{position:absolute;bottom:8px;left:8px;background:var(--surface);color:var(--fg);font:600 .72rem var(--display);padding:2px 8px;border-radius:999px}
.card .ph .no{position:absolute;top:8px;left:8px;background:var(--fg);color:var(--bg);font:700 .75rem var(--display);padding:2px 8px;border-radius:6px}
.card .bd{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.card .ttl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .ttl b{font:600 1rem var(--display);min-width:0}
.card .art{font:500 .78rem var(--display);color:var(--muted);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.meta span{background:var(--sunk);padding:2px 8px;border-radius:5px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;border-top:1px dashed var(--line);padding-top:8px;font-size:.8rem}
.prices span{color:var(--muted)}
.prices b{display:block;color:var(--fg);font:600 .95rem var(--display);font-variant-numeric:tabular-nums}
.prices .tot b{color:var(--c)}
.split{font-size:.75rem;padding:5px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}

/* table view */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:820px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.tbl th{font:600 .75rem var(--display);color:var(--muted);background:var(--sunk);position:sticky;top:0}
.tbl td.n{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl img{width:48px;height:48px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.tbl tfoot td{font-weight:700;background:var(--sunk)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cartons{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.cartons div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;gap:0;background:var(--p1-soft)}
.cartons div span{font:600 .72rem var(--display);color:var(--p1);direction:ltr;text-align:right}
.cartons div b{font:700 1rem var(--display);font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted);margin:0}
.costs{display:grid;gap:8px}
.costs .row{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:.9rem}
.costs .row b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.costs .row.big b{color:var(--pt);font-size:1.05rem}
.stack{height:22px;display:flex;border-radius:5px;overflow:hidden}
.stack i{display:grid;place-items:center;color:var(--surface);font:600 .72rem var(--display);font-style:normal}


/* inventory count */
.count{display:grid;grid-template-columns:1fr auto;grid-template-areas:'l d' 'i i';align-items:center;gap:6px 8px;border-top:1px dashed var(--line);padding-top:8px}
.count label{grid-area:l}.count .dif{grid-area:d}.count input{grid-area:i;max-width:none!important}
.count label{font-size:.78rem;color:var(--muted);white-space:nowrap}
.count input,.tbl input{font:600 1rem var(--display);width:100%;min-width:0;max-width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);text-align:center;font-variant-numeric:tabular-nums}
.tbl input{width:84px}
.count input:focus,.tbl input:focus{border-color:var(--c,var(--p1));background:var(--surface)}
.count input:disabled,.tbl input:disabled{opacity:.6}
.dif{font:600 .75rem var(--display);padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.dif.ok{background:var(--p1-soft);color:var(--p1)}
.dif.short{background:var(--warn-soft);color:var(--warn)}
.dif.over{background:var(--p2-soft);color:var(--p2)}
.dif.saving{opacity:.6}
.card.done{border-color:var(--c)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.prog .pg{display:grid;gap:6px}
.prog .pg .top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.prog .pg .top b{font-family:var(--display);font-variant-numeric:tabular-nums}
.prog .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--c)}
.prog .pg small{color:var(--muted);font-size:.78rem}
.status{font-size:.8rem;color:var(--muted)}


/* login gate */
body.locked header.top, body.locked main{display:none}
body:not(.locked) .gate{display:none}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.gate[hidden]{display:none!important}
.gate form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--p1);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.gate h2{font-size:1.25rem}
.gate .sub{margin:0}
.gate label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
.gate input{font:500 1rem var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);direction:rtl}
.gate input:focus{border-color:var(--p1);background:var(--surface);outline:none}
.gate button[type=submit]{font:600 1rem var(--display);padding:11px;border:0;border-radius:8px;background:var(--p1);color:var(--surface);cursor:pointer}
.gate button[type=submit]:disabled{opacity:.6;cursor:wait}
.gate .err{color:var(--warn);font-size:.85rem;min-height:1.2em;margin:0}
.gate .ghost{font:500 .85rem var(--body);background:none;border:0;color:var(--muted);cursor:pointer;justify-self:center}
.acct{display:flex;gap:6px;flex-wrap:wrap}
.acct button,.acct .btn{font:500 .8rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.acct button:disabled{opacity:.6;cursor:wait}
.gate .ghost{text-decoration:underline;text-align:center}
.syncbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-bottom:10px;font-size:.8rem;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:#2f9e5b}.dot.off{background:var(--warn)}
.who{display:inline-flex;align-items:center;gap:6px}
.who input{font:500 .85rem var(--body);width:130px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
.by{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.85rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:0 auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;text-align:center;z-index:50;box-shadow:0 4px 14px rgb(0 0 0 / .25)}

/* lightbox */
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,720px);width:100%}
dialog::backdrop{background:rgb(0 0 0 / .78)}
dialog .lb{background:var(--surface);border-radius:12px;overflow:hidden;display:grid}
dialog img{width:100%;max-height:70vh;object-fit:contain;background:#000}
dialog .cap{padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
dialog .nav{display:flex;gap:6px}
dialog .nav button{font:600 .85rem var(--display);border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card .bd{padding:10px}
  .prices{grid-template-columns:1fr}
  .kv b{font-size:1.1rem}
  h1{font-size:1.2rem}
  .head-row .sub{display:none}
  .head-row{padding-block:10px 8px}
  .acct{flex-wrap:wrap;gap:5px}
  .acct button,.acct .btn{padding:4px 9px;font-size:.74rem}
  .syncbar{padding-bottom:8px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style><style>html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body class="locked">

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h2>بضاعة أحذية الحوراني</h2>
    <p class="sub">اكتب رمز الدخول لعرض البضاعة والجرد.</p>
    <label>رمز الدخول<input id="gateCode" type="password" inputmode="numeric" autocomplete="current-password" required></label>

    <a class="ghost" href="guide.html">كيف أستخدم اللوحة؟</a>
  </form>
</div>
<header class="top">
  <div class="wrap">

      <div>
        <h1>بضاعة أحذية الحوراني</h1>

      </div>

    <div class="syncbar">
      <span class="sync"><i class="dot" id="syncDot"></i><span id="syncTxt">جارٍ الاتصال…</span></span>
      <label class="who">اسمك <input id="who" maxlength="40" placeholder="مثلاً: أكرم" autocomplete="name"></label>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-ov" data-v="ov" aria-selected="true">نظرة عامة</button>

      <button role="tab" id="tab-pt" data-v="pt" aria-selected="false">بضاعة الشراكة</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>
  <!-- OVERVIEW -->
  <section class="view" id="v-ov">
    <div class="panel" id="invProgress"></div>
    <div class="blocks" id="ovBlocks"></div>
    <div class="panel">
      <h2>توزيع الأزواج حسب الفئة</h2>
      <div class="scroll"><table class="cat-table" id="catTable"></table></div>

      <div class="toolbar">

          <button data-s="all" aria-pressed="true">الكل</button>

</main>

<dialog id="lb"><div class="lb">
  <img id="lbImg" alt="">
  <div class="cap"><div><b id="lbT"></b> <span class="sub" id="lbS"></span></div>

</div></dialog>

function block(c,title,tag,arr,extraRows,go){
  const cats={};arr.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.qty);

  const bar=CATS.filter(k=>cats[k]).map(k=>`<i style="width:${cats[k]/tot*100}%;background:${CATC[k]}" title="${k} ${cats[k]}"></i>`).join('');
  const leg=CATS.filter(k=>cats[k]).map(k=>`<span style="--c:${CATC[k]}">${k} ${cats[k]}</span>`).join('');
  return `<div class="block" style="--c:${c}">
    <h2>${title} <span class="tag ${tag}">${arr.length} موديل</span></h2>
    <div class="kv"><div><span>عدد الأزواج</span><b>${f0(tot)}</b></div>${extraRows}</div>
    <div class="mix"><div class="bar">${bar}</div><div class="legend">${leg}</div></div>
    <button class="go" data-go="${go}">عرض الأصناف بالصور ←</button>
  </div>`;
}

function progOf(arr){
  const done=arr.filter(x=>cnt(x)!=null);
  const exp=sum(done,'qty'), got=done.reduce((t,x)=>t+cnt(x),0);
  return {n:arr.length,done:done.length,ok:done.filter(x=>cnt(x)===x.qty).length,d:got-exp};
}
function renderProgress(){
  const g=[['مشطاح 1','var(--p1)',P1],['مشطاح 2','var(--p2)',P2],['الشراكة','var(--pt)',part]];
  $('invProgress').innerHTML=`<h2>الجرد <span class="tag t-p1">${ALL.filter(x=>cnt(x)!=null).length} من ${ALL.length} صنف</span></h2>
  <div class="prog">${g.map(([t,c,a])=>{const p=progOf(a);
    const dTxt=p.done?(p.d===0?'لا يوجد فرق بالأصناف المجرودة':(p.d<0?`ناقص ${-p.d} جوز بالأصناف المجرودة`:`زايد ${p.d} جوز بالأصناف المجرودة`)):'لسا ما بلّش الجرد';
    return `<div class="pg" style="--c:${c}"><div class="top"><span>${t}</span><b>${p.done} / ${p.n}</b></div>
      <div class="track"><i style="width:${p.done/p.n*100}%"></i></div><small>${p.ok} مطابق · ${dTxt}</small></div>`}).join('')}</div>
  <div class="status"></div>`;
}

// ---------- ZIP of photos (folder per section)
const safe=s=>String(s??'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();
$('zipBtn').onclick=async()=>{
  if(!window.JSZip){toast('مكتبة الضغط ما انحمّلت — حدّث الصفحة');return}
  const btn=$('zipBtn'); btn.disabled=true;
  try{
    const zip=new JSZip(); const all=ALL.flatMap(it=>it.img.map((f,i)=>({it,f,i}))); let done=0;
    for(const {it,f,i} of all){
      const r=await fetch(f); if(!r.ok) throw new Error('fetch');
      const name=`${String(it.n).padStart(2,'0')} - ${safe(it.desc)}${it.art?' - '+safe(it.art):''}${it.img.length>1?' ('+(i+1)+')':''}.webp`;
      zip.folder(palName(it)).file(name,await r.blob());
      $('zipTxt').textContent=`جارٍ التجهيز ${++done}/${all.length}`;
    }
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='صور بضاعة الحوراني.zip';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    toast('بدأ تنزيل ملف الصور');
  }catch(e){toast('ما قدرت أجهّز ملف الصور — تأكد من الإنترنت')}
  finally{btn.disabled=false;$('zipTxt').textContent='تنزيل الصور (ZIP)'}
};

}

// ---------- access code gate
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryCode(c){return !!c && (await sha(REPO+':'+c))===GATE_HASH}
function unlock(c){PIN=c;try{localStorage.setItem('hv-pin',c)}catch(e){}document.body.classList.remove('locked');startApp()}
$('gateForm').addEventListener('submit',async e=>{e.preventDefault();const c=$('gateCode').value.trim();
  if(await tryCode(c)) unlock(c); else {$('gateErr').textContent='الرمز غلط، جرّب مرة ثانية.';$('gateCode').select()}});
$('btnOut').onclick=()=>{try{localStorage.removeItem('hv-pin')}catch(e){}location.reload()};
(async()=>{let c='';try{c=localStorage.getItem('hv-pin')||''}catch(e){}if(await tryCode(c)) unlock(c); else $('gateCode').focus()})();
</script>
